<style>
:root{
  --bg:#070b14;--panel:rgba(11,18,38,.78);--panel2:#0b1226;--line:#26365a;
  --cyan:#38d6f0;--blue:#3b82f6;--amber:#fde68a;--green:#a3e635;--red:#f87171;
  --text:#e2e8f0;--muted:#9ca3af;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:rgba(56,214,240,.18)}
img,svg,canvas{max-width:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.65;overflow-x:hidden;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}
ul{margin:0;padding:0;list-style:none}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}

/* background layers */
#rain{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;z-index:0;opacity:.32;pointer-events:none}
.vig{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,rgba(7,11,20,0) 0%,rgba(7,11,20,.72) 78%),linear-gradient(rgba(56,214,240,.035) 50%,transparent 50%);background-size:100% 100%,100% 4px}
.glow{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,30%),rgba(56,214,240,.10),transparent 70%)}
#prog{position:fixed;top:0;left:0;height:2px;width:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));transform-origin:0 50%;transform:scaleX(0);z-index:90}
#app{position:relative;z-index:2}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(7,11,20,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:18px;height:56px}
.logo{font-family:var(--mono);font-weight:700;color:var(--text);white-space:nowrap;font-size:.9rem}
.logo b{color:var(--cyan)}
.links{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-width:0}
.links::-webkit-scrollbar{display:none}
.links a{color:var(--muted);font-size:.82rem;padding:6px 10px;border-radius:8px;white-space:nowrap;font-family:var(--mono)}
.links a:hover{color:var(--cyan);background:rgba(56,214,240,.08);text-decoration:none}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{background:none;border:0;padding:5px 10px;font-family:var(--mono);font-size:.76rem;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--cyan);color:#041018;font-weight:700}

a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* hero */
.hero{display:grid;grid-template-columns:1.5fr .8fr;gap:44px;align-items:center;min-height:calc(100vh - 56px);min-height:calc(100svh - 56px);padding-top:40px;padding-bottom:40px}
.chip{display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(163,230,53,.4);background:rgba(163,230,53,.07);color:var(--green);padding:5px 13px;border-radius:99px;font-family:var(--mono);font-size:.76rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(163,230,53,.7);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(163,230,53,0)}100%{box-shadow:0 0 0 0 rgba(163,230,53,0)}}
.glitch{position:relative;font-size:clamp(1.65rem,8.2vw,4.7rem);font-weight:800;letter-spacing:-.025em;line-height:1.05;margin:18px 0 10px;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;pointer-events:none}
.glitch::before{color:var(--cyan);transform:translate(-3px,0);animation:g1 4.2s infinite steps(1)}
.glitch::after{color:var(--red);transform:translate(3px,0);animation:g2 3.3s infinite steps(1)}
@keyframes g1{0%,88%,100%{clip-path:inset(0 0 100% 0)}89%{clip-path:inset(8% 0 62% 0)}91%{clip-path:inset(46% 0 30% 0)}94%{clip-path:inset(72% 0 6% 0)}96%{clip-path:inset(0 0 100% 0)}}
@keyframes g2{0%,82%,100%{clip-path:inset(100% 0 0 0)}83%{clip-path:inset(60% 0 12% 0)}86%{clip-path:inset(14% 0 70% 0)}89%{clip-path:inset(34% 0 44% 0)}92%{clip-path:inset(100% 0 0 0)}}
.role{font-family:var(--mono);font-size:clamp(.95rem,2.4vw,1.2rem);color:var(--cyan);min-height:1.8em}
.role .pr{color:var(--green)}
.caret{display:inline-block;width:.55em;height:1.05em;background:var(--cyan);vertical-align:-.15em;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lead{color:#cbd5e1;max-width:60ch;margin-top:12px;font-size:1.04rem}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(13,22,48,.7);color:var(--text);padding:10px 18px;border-radius:10px;font-weight:600;font-size:.92rem;cursor:pointer;transition:.2s}
.btn:hover{border-color:var(--cyan);color:var(--cyan);text-decoration:none;box-shadow:0 0 18px rgba(56,214,240,.25)}
.btn.pri{background:var(--cyan);color:#041018;border-color:var(--cyan)}
.btn.pri:hover{color:#041018;box-shadow:0 0 24px rgba(56,214,240,.55)}
.stats{display:flex;flex-wrap:wrap;gap:22px;margin-top:26px;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.stats b{display:block;color:var(--text);font-size:1.5rem;line-height:1.1}
.hint{margin-top:20px;font-family:var(--mono);font-size:.76rem;color:var(--amber);opacity:.9}

.idc{position:relative;margin:0 auto;width:min(100%,280px);padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--panel);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.idc img{display:block;width:100%;height:auto;border-radius:10px;filter:contrast(1.05) saturate(.9)}
.idc .scan{position:absolute;left:10px;right:10px;top:10px;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 14px 3px rgba(56,214,240,.6);animation:scan 3.2s ease-in-out infinite;border-radius:2px}
@keyframes scan{0%,100%{transform:translateY(0);opacity:0}10%{opacity:1}50%{transform:translateY(calc(var(--h,300px) - 6px));opacity:1}90%{opacity:0}}
.idc .c{position:absolute;width:18px;height:18px;border:2px solid var(--cyan)}
.idc .c.a{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:16px}
.idc .c.b{top:-1px;right:-1px;border-left:0;border-bottom:0;border-top-right-radius:16px}
.idc .c.d{bottom:-1px;left:-1px;border-right:0;border-top:0;border-bottom-left-radius:16px}
.idc .c.e{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:16px}
.idc figcaption{font-family:var(--mono);font-size:.7rem;color:var(--muted);padding:10px 4px 2px;display:flex;justify-content:space-between;gap:8px}
.idc figcaption b{color:var(--green);font-weight:500}

/* sections */
section.s{padding:64px 0}
.st{display:flex;align-items:baseline;gap:12px;font-size:1.6rem;font-weight:800;margin-bottom:26px}
.st small{font-family:var(--mono);font-size:.8rem;color:var(--cyan);font-weight:500}
.st::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:border-color .25s,box-shadow .25s,transform .25s}
.card:hover{border-color:rgba(56,214,240,.6);box-shadow:0 0 28px rgba(56,214,240,.12)}
.tag{display:inline-block;font-family:var(--mono);font-size:.72rem;border:1px solid var(--line);color:#bcd6e6;padding:3px 9px;border-radius:6px;background:rgba(56,214,240,.04);transition:.2s}
.tag:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-1px)}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.reveal{opacity:1}
.js .reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.js .reveal.in{opacity:1;transform:none}

.about{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.about p+p{margin-top:12px}
.about p{color:#cbd5e1}
.facts dt{font-family:var(--mono);font-size:.72rem;color:var(--cyan);text-transform:uppercase;letter-spacing:.06em;margin-top:12px}
.facts dt:first-child{margin-top:0}
.facts dd{margin:2px 0 0}

/* terminal */
.term{background:#050810;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-family:var(--mono);font-size:.82rem;box-shadow:0 0 40px rgba(56,214,240,.08)}
.term-bar{display:flex;align-items:center;gap:7px;background:#0a1226;padding:9px 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:.74rem}
.term-bar i{width:10px;height:10px;border-radius:50%;background:#334155}
.term-bar i:nth-child(1){background:#f87171}.term-bar i:nth-child(2){background:#fbbf24}.term-bar i:nth-child(3){background:#4ade80}
.term-bar span{margin-left:8px}
#out{margin:0;padding:14px;height:260px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#cbd5e1;font:inherit}
#out .ok{color:var(--green)}#out .wr{color:var(--amber)}#out .er{color:var(--red)}#out .dm{color:var(--muted)}#out .cy{color:var(--cyan)}
.p{color:var(--green)}.d{color:var(--blue)}
.term-in{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:#060a14}
.term-in label{white-space:nowrap}
.term-in input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;caret-color:var(--cyan);border-radius:0;-webkit-appearance:none;appearance:none}
.qc{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px;background:#060a14}
.qc button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;font:inherit;font-size:.72rem;padding:3px 9px;cursor:pointer}
.qc button:hover{color:var(--cyan);border-color:var(--cyan)}

/* experience */
.tl{position:relative;padding-left:28px;display:grid;gap:18px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--cyan),var(--line))}
.tl-item{position:relative}
.tl-item::before{content:"";position:absolute;left:-27px;top:24px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--cyan);box-shadow:0 0 12px var(--cyan)}
.tl-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.tl-h h3{font-size:1.1rem}
.dur{font-family:var(--mono);font-size:.76rem;color:var(--amber)}
.tl-h h3{min-width:0}
.rl{color:var(--cyan);font-size:.92rem;margin-top:2px}
.rl em{color:var(--muted);font-style:normal}
.pts{margin-top:10px;display:grid;gap:6px}
.pts li{position:relative;padding-left:20px;color:#cbd5e1;font-size:.94rem}
.pts li::before{content:">";position:absolute;left:0;color:var(--green);font-family:var(--mono)}

/* projects */
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:18px}
.pj h3{font-size:1.02rem;line-height:1.35}
.pj .pts{margin-top:10px}
.pj.feat{grid-column:1/-1;border-color:rgba(56,214,240,.45)}
.badge{display:inline-block;font-family:var(--mono);font-size:.68rem;color:var(--green);border:1px solid rgba(163,230,53,.4);padding:1px 8px;border-radius:99px;margin-bottom:8px}
.topo{width:100%;height:auto;margin-top:16px;background:rgba(5,8,16,.6);border:1px solid var(--line);border-radius:10px}
.topo .t1{fill:var(--text);font:600 12px var(--sans)}
.topo .t2{fill:var(--muted);font:10px var(--mono)}
.topo .nd{fill:#0b1226;stroke:var(--line);stroke-width:1.5}
.topo .nd.hot{stroke:var(--cyan)}
.topo .nd.bad{stroke:var(--red)}
.topo .ln{stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 5;fill:none;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.topo .cap{fill:var(--muted);font:10px var(--mono)}

/* SOC feed */
.feedbox .top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:12px;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.feedbox .top b{color:var(--text)}
.live{color:var(--red)}
.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:7px;animation:blink 1s steps(1) infinite}
#feed{display:grid;gap:6px;min-height:340px;align-content:start}
.al{display:grid;grid-template-columns:62px 92px 36px 1fr auto;gap:10px;align-items:center;text-align:left;width:100%;background:rgba(5,8,16,.7);border:1px solid var(--line);border-left-width:3px;border-radius:8px;padding:8px 12px;font-family:var(--mono);font-size:.76rem;cursor:pointer;animation:slidein .4s ease}
@keyframes slidein{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.al time{color:var(--muted)}
.al b{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.al .lv{text-align:center;border-radius:4px;font-size:.68rem;padding:1px 0}
.al .msg{color:#cbd5e1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.al em{font-style:normal;color:var(--cyan);border:1px solid var(--line);border-radius:5px;padding:0 7px;font-size:.7rem}
.al.hi{border-left-color:var(--red)}.al.hi .lv{background:rgba(248,113,113,.18);color:var(--red)}
.al.mid{border-left-color:var(--amber)}.al.mid .lv{background:rgba(253,230,138,.14);color:var(--amber)}
.al.lo{border-left-color:var(--cyan)}.al.lo .lv{background:rgba(56,214,240,.12);color:var(--cyan)}
.al:hover{border-color:var(--cyan)}
.al.done{opacity:.6;border-left-color:var(--green)}
.al.done .lv{background:rgba(163,230,53,.15);color:var(--green)}
.al .tx{display:none;grid-column:1/-1;color:var(--green);font-size:.72rem}
.al.done .tx{display:block}
.note{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:12px}

/* skills, certs */
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.sg h3{font-size:.8rem;font-family:var(--mono);color:var(--cyan);text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.sg .tags{margin-top:12px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
.cg li{position:relative;padding:6px 0 6px 24px;border-bottom:1px dashed rgba(38,54,90,.7);font-size:.92rem}
.cg li::before{content:"\2713";position:absolute;left:0;color:var(--green);font-family:var(--mono)}
.cg li.k{color:var(--text);font-weight:600}
.act{margin-top:20px}
.act h3{font-size:1.02rem}
.act .sub{color:var(--muted);font-size:.86rem;font-family:var(--mono)}

/* education */
.eg{display:grid;gap:14px}
.eg .card{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eg h3{font-size:1rem}
.eg p{color:var(--muted);font-size:.9rem}
.eg .yr{font-family:var(--mono);color:var(--amber);font-size:.82rem;white-space:nowrap}

/* contact */
.cgrid{display:grid;grid-template-columns:1fr 1.1fr;gap:20px}
.cl{display:grid;gap:12px;margin-top:16px}
.cl .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:.86rem}
.cl .row span{color:var(--muted);min-width:78px}
.mini{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:2px 9px;font-family:var(--mono);font-size:.7rem;cursor:pointer}
.mini:hover{color:var(--cyan);border-color:var(--cyan)}
form.cf{display:grid;gap:12px}
.cf label{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.cf input,.cf textarea{width:100%;margin-top:4px;font-size:16px;-webkit-appearance:none;appearance:none;background:#050810;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--text);font:inherit;outline:0}
.cf input:focus,.cf textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,214,240,.15)}
.cf textarea{min-height:110px;resize:vertical}
footer.ft{border-top:1px solid var(--line);padding:26px 0 90px;color:var(--muted);font-family:var(--mono);font-size:.76rem;background:rgba(7,11,20,.7)}
footer.ft .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}

/* bugs */
#bugs{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:60;overflow:hidden}
.bug{position:absolute;left:0;top:0;width:30px;height:30px;padding:0;border:0;background:none;pointer-events:auto;cursor:crosshair;color:var(--green);filter:drop-shadow(0 0 6px currentColor);will-change:transform;touch-action:manipulation}
.bug.crit{color:var(--red)}.bug.warn{color:var(--amber)}
.bug svg{width:100%;height:100%;display:block;overflow:visible}
.bug .legs{transform-box:fill-box;transform-origin:center;animation:skit .16s linear infinite alternate}
.bug.idle .legs{animation-play-state:paused}
@keyframes skit{from{transform:scale(1,1)}to{transform:scale(1.14,.88)}}
.bug.splat svg{animation:splat .55s ease-out forwards}
@keyframes splat{0%{transform:scale(1);opacity:1}30%{transform:scale(1.7,.5)}100%{transform:scale(2.3,.12);opacity:0}}
.bit{position:absolute;left:0;top:0;font-family:var(--mono);font-size:12px;color:var(--green);pointer-events:none;animation:fly .7s ease-out forwards}
@keyframes fly{from{transform:translate(var(--x),var(--y));opacity:1}to{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy)));opacity:0}}
.hud{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;gap:10px;background:rgba(7,11,20,.88);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-family:var(--mono);font-size:.72rem;color:var(--muted);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hud b{color:var(--green)}
.hud .bar{width:60px;height:4px;background:#1b2a47;border-radius:3px;overflow:hidden}
.hud .bar i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
.hud button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;font:inherit;padding:2px 8px;cursor:pointer}
.hud button:hover{color:var(--cyan);border-color:var(--cyan)}
#toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);z-index:75;background:#06210f;border:1px solid var(--green);color:var(--green);font-family:var(--mono);font-size:.8rem;padding:8px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100vw - 24px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

.calm .glitch::before,.calm .glitch::after,.calm .scan,.calm .pk{display:none}
.calm .dot,.calm .topo .ln,.calm .caret{animation:none}
.calm #rain{opacity:.12}
@media (prefers-reduced-motion:reduce){
  .glitch::before,.glitch::after,.scan,.pk,.dot,.topo .ln,.caret{animation:none}
  .glitch::before,.glitch::after,.scan,.pk{display:none}
  html{scroll-behavior:auto}
  .js .reveal{opacity:1;transform:none;transition:none}
}
@media (max-width:820px){
  .hero{grid-template-columns:1fr;min-height:0;gap:28px}
  .idc{width:200px;order:-1;margin:0}
  .about,.cgrid{grid-template-columns:1fr}
  .cg{grid-template-columns:1fr}
  .al{grid-template-columns:54px 34px 1fr auto}
  .al b{display:none}
  .al .msg{white-space:normal}
  .logo{display:none}
  .links{margin-left:0}
  section.s{padding:46px 0}
}

/* grands écrans */
@media (min-width:1400px){.wrap{max-width:1180px}}
/* tablettes / petits laptops */
@media (max-width:1024px){.hero{gap:30px}}
/* téléphones */
@media (max-width:560px){
  .wrap{padding:0 16px}
  .hero{padding-top:24px;padding-bottom:28px}
  .st{font-size:1.3rem;gap:8px}
  .card{padding:16px}
  .tl{padding-left:22px}
  .tl-item::before{left:-21px}
  .tl::before{left:5px}
  .stats{gap:16px}
  .cl .row span{min-width:64px}
  .term{font-size:.76rem}
  #out{height:220px;padding:12px}
  .eg .card{flex-direction:column;gap:6px}
  .hud{left:8px;right:8px;justify-content:space-between;font-size:.68rem;padding:6px 10px}
  .hud .bar{width:40px}
  #toast{font-size:.74rem}
  .cta .btn{flex:1 1 100%;justify-content:center}
}
/* très petits écrans */
@media (max-width:360px){
  .al{grid-template-columns:48px 30px 1fr}
  .al em{display:none}
  .links a{padding:6px 8px;font-size:.78rem}
}
/* écrans tactiles : cibles >= 44px */
@media (pointer:coarse){
  .links a,.lang button,.btn,.mini,.qc button,.hud button{min-height:44px;display:inline-flex;align-items:center;justify-content:center}
  .mini{padding:2px 14px}
  .qc button{padding:3px 12px}
  .al{padding:12px}
  .bug{width:40px;height:40px;margin:-5px 0 0 -5px}
}
/* mobile en mode paysage */
@media (max-height:480px) and (orientation:landscape){
  .hero{min-height:0}
  #bugs{display:none}
}
/* impression */
@media print{
  #rain,.vig,.glow,#prog,#bugs,.hud,#toast,.nav,#console,.lang,.scan,.cta{display:none!important}
  html,body{background:#fff!important;color:#000!important}
  .card{background:#fff!important;border-color:#bbb!important;box-shadow:none!important;break-inside:avoid}
  .js .reveal{opacity:1!important;transform:none!important}
  a{color:#000!important}
  .glitch::before,.glitch::after{display:none}
}
</style>

    t.edu.map(function(e){return '<div class="card reveal"><div><h3>'+esc(e.t)+'</h3><p>'+esc(e.s)+'</p></div><span class="yr">'+esc(e.y)+'</span></div>'}).join('')+'</div></section>';

  var c=t.contact;
  var contact='<section class="s wrap" id="contact"><h2 class="st reveal"><small>08</small>'+S[7]+'</h2><div class="cgrid reveal"><div class="card"><p style="color:#cbd5e1">'+esc(c.intro)+'</p><div class="cl">'+
    '<div class="row"><span>'+esc(c.email)+'</span><a href="mailto:'+EMAIL+'">'+EMAIL+'</a><button type="button" class="mini" data-copy="'+EMAIL+'">'+esc(c.copy)+'</button></div>'+
    '<div class="row"><span>'+esc(c.li)+'</span><a href="https://www.linkedin.com/in/nabil-lemzabi-b233bb198/" target="_blank" rel="noopener noreferrer">Nabil Lemzabi</a></div>'+
    '<div class="row"><span>'+esc(t.cv.row)+'</span><button type="button" class="btn" style="padding:6px 14px" data-cv="en">⬇ '+esc(t.cv.en)+' (EN)</button><button type="button" class="btn" style="padding:6px 14px" data-cv="fr">⬇ '+esc(t.cv.fr)+' (FR)</button></div></div></div>'+
    '<form class="card cf" id="cf" novalidate><label>'+esc(c.name)+'<input id="cn" type="text" autocomplete="name" required></label><label>'+esc(c.mail)+'<input id="ce" type="email" autocomplete="email"></label><label>'+esc(c.msg)+'<textarea id="cm" required></textarea></label><button type="submit" class="btn pri">'+esc(c.send)+'</button></form></div></section>';

  var foot='<footer class="ft"><div class="wrap"><span>© 2026 Nabil Lemzabi</span></div></footer>';

  app.innerHTML = nav+hero+'<div id="termslot"></div>'+about+exp+proj+soc+skills+edu+contact+foot;
  $('#termslot').replaceWith(termEl);
}

/* ---------- terminal (created once) ---------- */
var termEl=document.createElement('section'); termEl.className='s wrap'; termEl.id='console'; termEl.style.paddingTop='8px'; termEl.style.paddingBottom='24px';
termEl.innerHTML='<div class="term"><div class="term-bar"><i></i><i></i><i></i><span>nabil@lab: ~ (interactive)</span></div><pre id="out" aria-live="polite"></pre>'+
  '<form class="term-in" autocomplete="off"><label for="cmd"><span class="p">nabil@lab</span>:<span class="d">~</span>$</label><input id="cmd" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="help"></form>'+
  '<div class="qc"></div></div>';
var out=termEl.querySelector('#out'), cmdIn=termEl.querySelector('#cmd'), hist=[], hi=0;
['help','whoami','stack','lab','projects','nmap','bugs','contact','cv','clear'].forEach(function(c){
  var b=document.createElement('button'); b.type='button'; b.textContent=c; b.addEventListener('click',function(){run(c)}); termEl.querySelector('.qc').appendChild(b);
});
function print(h){out.insertAdjacentHTML('beforeend',h+'\n'); out.scrollTop=out.scrollHeight}
function lines(a,cls){a.forEach(function(l){print(cls?'<span class="'+cls+'">'+esc(l)+'</span>':esc(l))})}
function run(raw){
  var cmd=raw.trim(), low=cmd.toLowerCase(), C=T[lang].con;
  print('<span class="p">nabil@lab</span>:<span class="d">~</span>$ '+esc(cmd));
  if(!cmd) return;
  if(low==='help') lines(C.help,'cy');
  else if(low==='whoami') lines(C.whoami);
  else if(low==='focus') lines(C.focus);
  else if(low==='stack') lines(C.stack);
  else if(low==='lab') lines(C.lab);
  else if(low==='projects') T[lang].proj.forEach(function(p,k){print('<span class="cy">'+(k+1)+'.</span> '+esc(p.t))});
  else if(low==='contact') lines(C.contactL);
  else if(low==='cv'||low==='cv en'||low==='cv fr'){ var cc=low==='cv'?lang:low.slice(3); print('<span class="ok">'+esc(T[lang].cv.ok+' ('+cc.toUpperCase()+')')+'</span>'); downloadCV(cc) }
  else if(low==='clear'){out.textContent=''}
  else if(low==='nmap'||low==='nmap localhost'||low==='nmap portfolio'){
    print('<span class="dm">Starting Nmap (simulated) against portfolio.local</span>');
    print('PORT       STATE     SERVICE'); print('22/tcp     <span class="wr">filtered</span>  ssh');
    print('80/tcp     <span class="ok">open</span>      http   (this page)'); print('443/tcp    <span class="ok">open</span>      https  (this page)');
    print('31337/tcp  <span class="er">closed</span>    elite  (nice try)'); print('<span class="dm">'+esc(C.nmapNote)+'</span>');
  }
  else if(low==='bugs') print('<span class="ok">'+esc(C.bugsS(patched,TOTAL))+'</span>');
  else if(low==='bugs release'){print('<span class="wr">'+esc(C.bugsR)+'</span>'); release()}
  else if(low==='hack'||low==='exploit'||low.indexOf('metasploit')===0) print('<span class="wr">'+esc(C.hack)+'</span>');
  else if(low==='sudo hire nabil'||low==='sudo hire'){lines(C.sudo,'ok'); setTimeout(function(){var c=$('#contact'); if(c) c.scrollIntoView({behavior:RM?'auto':'smooth'})},900)}
  else print('<span class="er">'+esc(C.nf+cmd.split(' ')[0]+C.nfTail)+'</span>');
}
termEl.querySelector('form').addEventListener('submit',function(e){e.preventDefault(); var v=cmdIn.value; if(v.trim()){hist.push(v); hi=hist.length} cmdIn.value=''; run(v)});
cmdIn.addEventListener('keydown',function(e){
  if(e.key==='ArrowUp'&&hist.length){e.preventDefault(); hi=Math.max(0,hi-1); cmdIn.value=hist[hi]||''}
  else if(e.key==='ArrowDown'&&hist.length){e.preventDefault(); hi=Math.min(hist.length,hi+1); cmdIn.value=hist[hi]||''}
});
async function boot(){
  var B=T[lang].boot;
  for(var i=0;i<B.length;i++){ print('<span class="'+B[i][0]+'">'+esc(B[i][1])+'</span>'); await sleep(RM?0:300); }
}

/* ---------- role typing ---------- */
var roleTimer;
function startRole(){
  clearTimeout(roleTimer);
  var el=$('#role'); if(!el) return;
  var roles=T[lang].roles;
  if(RM){el.textContent=roles[0]; return}
  var i=0,j=0,del=false;
  (function tick(){
    var w=roles[i]; el.textContent=w.slice(0,j);
    if(!del){ if(j<w.length){j++; roleTimer=setTimeout(tick,65)} else {del=true; roleTimer=setTimeout(tick,1600)} }
    else { if(j>0){j--; roleTimer=setTimeout(tick,28)} else {del=false; i=(i+1)%roles.length; roleTimer=setTimeout(tick,260)} }
  })();
}

/* ---------- SOC feed ---------- */
var feedTimer, nAlerts=0, nTri=0;
function stats(){var a=$('#fa'),b=$('#ft'); if(a) a.textContent=nAlerts; if(b) b.textContent=nTri}
function addAlert(){
  var f=$('#feed'); if(!f) return;
  var a=ALERTS[Math.floor(Math.random()*ALERTS.length)];
  var row=document.createElement('button'); row.type='button';
  row.className='al '+(a.l>=10?'hi':a.l>=7?'mid':'lo');
  row.innerHTML='<time>'+new Date().toTimeString().slice(0,8)+'</time><b>'+esc(a.s)+'</b><span class="lv">L'+a.l+'</span><span class="msg">'+esc(a.m)+'</span><em>'+esc(a.a)+'</em><span class="tx">→ '+esc(a.x)+(a.a==='TEST'?'':' · MITRE ATT&amp;CK '+esc(a.a))+'</span>';
  row.addEventListener('click',function(){ if(row.classList.contains('done')) return; row.classList.add('done'); nTri++; stats(); toast('Triaged: '+a.x) });
  f.prepend(row); nAlerts++;
  while(f.children.length>7) f.lastChild.remove();
  stats();
}
function startFeed(){
  clearInterval(feedTimer); nAlerts=0; nTri=0;
  for(var i=0;i<5;i++) addAlert();
  feedTimer=setInterval(function(){ if(!document.hidden) addAlert() }, RM?5000:2400);
}

/* ---------- bugs ---------- */
var BUG_SVG='<svg viewBox="0 0 32 32" aria-hidden="true"><g class="legs" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"><path d="M10 12 L3 9"/><path d="M9 17 L1.5 17"/><path d="M10 22 L3 26"/><path d="M22 12 L29 9"/><path d="M23 17 L30.5 17"/><path d="M22 22 L29 26"/><path d="M13 6 L10 1"/><path d="M19 6 L22 1"/></g><ellipse cx="16" cy="19" rx="7" ry="9" fill="currentColor"/><circle cx="16" cy="8" r="4.2" fill="currentColor"/><path d="M16 12 V28" stroke="#070b14" stroke-width="1" opacity=".55"/><circle cx="14.3" cy="7" r="1" fill="#070b14"/><circle cx="17.7" cy="7" r="1" fill="#070b14"/></svg>';
var layer=$('#bugs'), bugs=[], patched=0, TOTAL=10, calm=false, W=innerWidth, H=innerHeight, mx=-9999, my=-9999, spawnTimers=[];
function spawnOne(i){
  var el=document.createElement('button'); el.type='button'; el.tabIndex=-1;
  var kind=(i%5===0)?'crit':(i%3===0?'warn':'ok');
  el.className='bug '+kind; el.innerHTML=BUG_SVG;
  var side=Math.floor(Math.random()*4), x, y;
  if(side===0){x=-40;y=Math.random()*H} else if(side===1){x=W+10;y=Math.random()*H} else if(side===2){x=Math.random()*W;y=-40} else {x=Math.random()*W;y=H+10}
  var b={el:el,x:x,y:y,a:Math.atan2(H/2-y,W/2-x)+(Math.random()-.5),sp:(kind==='crit'?75:45)+Math.random()*35,pause:0,dead:false,kind:kind,inside:false,id:String(1000+Math.floor(Math.random()*9000))};
  el.addEventListener('pointerdown',function(e){e.preventDefault(); squash(b)});
  layer.appendChild(el); bugs.push(b);
}
function burst(x,y){
  for(var i=0;i<9;i++){
    var s=document.createElement('span'); s.className='bit'; s.textContent=Math.random()>.5?'1':'0';
    s.style.setProperty('--x',x+'px'); s.style.setProperty('--y',y+'px');
    s.style.setProperty('--dx',(Math.random()*120-60)+'px'); s.style.setProperty('--dy',(Math.random()*120-60)+'px');
    layer.appendChild(s); (function(n){setTimeout(function(){n.remove()},720)})(s);
  }
}
function squash(b){
  if(b.dead||calm) return;
  b.dead=true; patched++; b.el.classList.add('splat'); burst(b.x+15,b.y+15);
  var sev={crit:'critical',warn:'medium',ok:'low'}[b.kind];
  toast('BUG-'+b.id+' patched ('+sev+')');
  setTimeout(function(){b.el.remove(); bugs=bugs.filter(function(q){return q!==b})},600);
  hud();
  if(patched>=TOTAL){ setTimeout(function(){toast(T[lang].win,4200)},900) }
}
function clearBugs(){spawnTimers.forEach(clearTimeout); spawnTimers=[]; bugs.forEach(function(b){b.el.remove()}); bugs=[]}
function release(){
  clearBugs(); patched=0; calm=false; document.documentElement.classList.remove('calm');
  for(var i=0;i<TOTAL;i++){ (function(k){spawnTimers.push(setTimeout(function(){ if(!calm) spawnOne(k) }, k*450+300))})(i) }
  hud();
}
function hud(){
  var h=T[lang].hud;
  $('#hl').textContent=h.l; $('#hc').textContent=patched+'/'+TOTAL;
  $('#hb').style.width=(patched/TOTAL*100)+'%';
  $('#hbtn').textContent=(calm||patched>=TOTAL)?h.rel:h.calm;
  var ob=$('#ob'); if(ob) ob.textContent=calm?0:Math.max(0,TOTAL-patched);
}
$('#hbtn').addEventListener('click',function(){
  if(calm||patched>=TOTAL){ release() }
  else { calm=true; document.documentElement.classList.add('calm'); clearBugs(); hud() }
});
var last=performance.now();
function loop(now){
  var dt=Math.min(.05,(now-last)/1000); last=now;
  for(var i=0;i<bugs.length;i++){
    var b=bugs[i]; if(b.dead) continue;
    if(b.pause>0){ b.pause-=dt; b.el.classList.add('idle') }
    else{
      b.el.classList.remove('idle');
      b.a+=(Math.random()-.5)*dt*4;
      var sp=b.sp, dx=b.x+15-mx, dy=b.y+15-my, d=Math.sqrt(dx*dx+dy*dy);
      if(d<130){ var fa=Math.atan2(dy,dx), diff=Math.atan2(Math.sin(fa-b.a),Math.cos(fa-b.a)); b.a+=diff*Math.min(1,dt*5); sp*=2.4 }
      b.x+=Math.cos(b.a)*sp*dt; b.y+=Math.sin(b.a)*sp*dt;
      if(!b.inside){ if(b.x>0&&b.x<W-30&&b.y>0&&b.y<H-30) b.inside=true }
      else{
        if(b.x<0){b.x=0;b.a=Math.PI-b.a} if(b.x>W-30){b.x=W-30;b.a=Math.PI-b.a}
        if(b.y<0){b.y=0;b.a=-b.a} if(b.y>H-30){b.y=H-30;b.a=-b.a}
      }
      if(Math.random()<dt*.25) b.pause=.4+Math.random()*1.4;
    }
    b.el.style.transform='translate('+b.x.toFixed(1)+'px,'+b.y.toFixed(1)+'px) rotate('+(b.a*57.2958+90).toFixed(1)+'deg)';
  }
  requestAnimationFrame(loop);
}
addEventListener('pointermove',function(e){mx=e.clientX; my=e.clientY; var s=document.documentElement.style; s.setProperty('--mx',mx+'px'); s.setProperty('--my',my+'px')},{passive:true});
document.documentElement.addEventListener('mouseleave',function(){mx=-9999;my=-9999});

/* ---------- matrix rain ---------- */
var cv=$('#rain'), cx=cv.getContext('2d'), fs=16, cols=0, drops=[];
var GL='01ABCDEF{}[]<>/;:=+*#$%&'.split('');
function sizeRain(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.floor(W*dpr); cv.height=Math.floor(H*dpr); cx.setTransform(dpr,0,0,dpr,0,0);
  cols=Math.ceil(W/fs); drops=[]; for(var i=0;i<cols;i++) drops.push(Math.random()*H/fs);
  cx.fillStyle='#070b14'; cx.fillRect(0,0,W,H);
}
var lastRain=0;
function rain(now){
  if(now-lastRain>45){
    lastRain=now;
    cx.fillStyle='rgba(7,11,20,.13)'; cx.fillRect(0,0,W,H);
    cx.font=fs+'px JetBrains Mono, monospace';
    for(var i=0;i<cols;i++){
      var y=drops[i]*fs;
      cx.fillStyle=Math.random()>.97?'#e8fbff':'rgba(56,214,240,.6)';
      cx.fillText(GL[Math.floor(Math.random()*GL.length)],i*fs,y);
      if(y>H&&Math.random()>.975) drops[i]=0; drops[i]+=1;
    }
  }
  requestAnimationFrame(rain);
}
function staticRain(){
  cx.fillStyle='#070b14'; cx.fillRect(0,0,W,H); cx.font=fs+'px JetBrains Mono, monospace';
  for(var i=0;i<cols;i++){ for(var k=0;k<4;k++){ cx.fillStyle='rgba(56,214,240,'+(Math.random()*.4)+')'; cx.fillText(GL[Math.floor(Math.random()*GL.length)],i*fs,Math.random()*H) } }
}

/* ---------- render + wiring ---------- */
var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function(es){es.forEach(function(e){ if(e.isIntersecting){e.target.classList.add('in'); io.unobserve(e.target)} })},{threshold:.08}) : null;
function wire(){
  $$('.lang button',app).forEach(function(b){ b.addEventListener('click',function(){ lang=b.getAttribute('data-l'); try{localStorage.setItem('nl-lang',lang)}catch(e){} render() }) });
  $$('[data-copy]',app).forEach(function(b){ b.addEventListener('click',function(){
    var v=b.getAttribute('data-copy'), c=T[lang].contact;
    var ok=function(){toast(c.copied)}, bad=function(){toast(c.copyfail+EMAIL,3000)};
    try{ navigator.clipboard.writeText(v).then(ok,bad) }catch(e){ bad() }
  })});
  $$('[data-cv]',app).forEach(function(b){ b.addEventListener('click',function(){ downloadCV(b.getAttribute('data-cv')) }) });
  var f=$('#cf',app);
  if(f) f.addEventListener('submit',function(e){
    e.preventDefault();
    var n=$('#cn').value.trim(), m=$('#cm').value.trim(), em=$('#ce').value.trim(), c=T[lang].contact;
    var body=m+(em?'\n\n— '+n+' ('+em+')':'\n\n— '+n);
    var a=document.createElement('a'); a.href='mailto:'+EMAIL+'?subject='+encodeURIComponent(c.subj+(n||'visitor'))+'&body='+encodeURIComponent(body);
    document.body.appendChild(a); a.click(); a.remove();
  });
  var ph=$('#photo'); var idc=$('.idc',app); if(ph&&idc){ var setH=function(){idc.style.setProperty('--h',ph.clientHeight+'px')}; setH(); ph.addEventListener('load',setH) }
  $$('.reveal',app).forEach(function(el){ if(io) io.observe(el); else el.classList.add('in') });
}
function render(){
  document.documentElement.lang=lang;
  build(); wire(); startRole(); startFeed(); hud();
}
var progEl=$('#prog');
addEventListener('scroll',function(){ var h=document.documentElement.scrollHeight-innerHeight; progEl.style.transform='scaleX('+(h>0?Math.min(1,scrollY/h):0)+')' },{passive:true});
addEventListener('resize',function(){ W=innerWidth; H=innerHeight; sizeRain(); if(RM||calm) staticRain(); var ph=$('#photo'),idc=$('.idc'); if(ph&&idc) idc.style.setProperty('--h',ph.clientHeight+'px') });

/* ---------- start ---------- */
render();
sizeRain();
if(RM){ staticRain(); calm=true; document.documentElement.classList.add('calm'); hud() }
else{ requestAnimationFrame(rain); release() }
requestAnimationFrame(function(t){last=t; loop(t)});
boot();
})();
</script>
